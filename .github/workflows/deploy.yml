name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/grooming-routine-ios-app-f8r6hg, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pages must already be enabled with Source = GitHub Actions. This step
      # cannot do it: `enablement: true` calls the create-Pages-site endpoint,
      # which the default GITHUB_TOKEN may not use — it fails with "Resource
      # not accessible by integration" on public and private repos alike.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
